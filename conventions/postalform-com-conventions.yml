media_type: application/json (MPP 402 responses are application/problem+json)
auth:
  style: >-
    Three surfaces, three postures. (1) Machine Payments API — NO credential of any kind; the gate is
    payment: an unpaid POST returns HTTP 402 with an x402 PAYMENT-REQUIRED header or MPP WWW-Authenticate:
    Payment challenges, and the retry carries PAYMENT-SIGNATURE or Authorization: Payment. (2) MCP server —
    no credential to connect or list tools; money-moving tools are gated by hosted checkout, a buyer-approved
    Stripe shared payment token (spt_...) or the same 402 challenges. (3) Projects API — HTTP bearer API key
    per workspace, pf_test_ (simulated, free) or pf_live_ (prepaid credits, real mail), rotatable via
    rotateApiKey with the secret returned once. No OAuth anywhere.
  detail: authentication/postalform-com-authentication.yml
idempotency:
  supported: true
  coverage: partial
  mechanism: >-
    Two mechanisms with one semantic. Machine Payments API: request_id (UUID, REQUIRED in the body of every
    POST) is "the strict idempotency key" — the same request_id with a byte-identical body replays or resumes
    the order (this is how the 402 retry works), the same request_id with a different body returns 409
    request_id_mismatch, and PostalForm "only collapses recent unpaid duplicate drafts", so a legitimate
    second mailing needs a fresh UUID. Projects API: an Idempotency-Key request header, REQUIRED on
    createLetter and createPostcard; a replay returns 200 "Idempotent replay" (201 on first create) and
    "retrying the same quote with the same key returns the existing order instead of creating another one".
    MCP: an optional request_id argument on the draft, upload and machine-order tools; complete_checkout is
    retried with the same checkout_session_id and token ("an unverified or processing payment must not prompt
    another order or replacement payment"), and PostalForm confirms the existing PaymentIntent "using a
    stable Stripe idempotency key".
  header: 'Idempotency-Key (Projects only)'
  body_field: 'request_id (Machine Payments API, all POSTs; MCP tools, optional)'
  key_format: 'client-generated UUID (machine API: format uuid); free-form string on Projects (docs example "invoice-1042")'
  retention: 'undocumented as a duration; machine API collapses "recent unpaid" drafts only'
  conflict_behavior: '409 request_id_mismatch on payload drift (machine API); Projects behaviour on a key reused with a different quote is not documented'
  scope:
  - validateMachineOrder
  - createMachineOrder
  - validateMachineFlowerLetter
  - createMachineFlowerLetter
  - validateMppMachineOrder
  - createMppMachineOrder
  - validateMppMachineFlowerLetter
  - createMppMachineFlowerLetter
  - validateMppShippingLabel
  - createMppShippingLabel
  - createLetter
  - createPostcard
  - complete_checkout (MCP, by checkout_session_id + token)
  coverage_basis: >-
    Counted against the mutating surface of both contracts: the Machine Payments API's 10 POSTs ALL carry the
    key (10/10 — Stripe-shaped for that contract), while the Projects API carries it on 2 of its 14 writes
    (createLetter, createPostcard). The 12 uncovered Projects writes are non-committing or configuration
    operations — upload intents, quotes (idempotent by nature, they create a priced quote_id), webhook
    endpoint create/disable/rotate, event replay, credit checkout/setup sessions, auto-refill config and key
    rotation — none of which produces mail or spends credit directly. Every operation that PRINTS MAIL or
    SPENDS MONEY, on every surface, is covered. Recorded as partial because the rule is literal about "all
    writes"; a reader should know this is the opposite of a cosmetic 2-of-99 mechanism.
  docs:
  - https://postalform.com/openapi.json (info.description, MachineOrderRequest.request_id)
  - https://postalform.com/developer-mail-api
