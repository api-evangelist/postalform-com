  - {operation: postalform.preview_letter_order_draft, surface: MCP, description: 'readOnlyHint true; renders and validates without writing'}
  detail: sandbox/postalform-com-sandbox.yml
reversibility:
  grade: documented
  docs: https://postalform.com/terms
  note: >-
    A reversal path exists (cancel-and-refund by contacting support before production) and a state boundary
    is stated ("before printing or carrier handoff begins"), but the reversal is discretionary ("we may be
    able to cancel"), is not a fixed duration, and no API operation performs it on any of the three surfaces.
    Express orders are explicitly irreversible from the moment of payment. After carrier acceptance nothing
    can be recalled. Graded documented (0.4), not verified: the window is a condition, not a stated period,
    and the path is an email, not an operation. Nothing below asserts a window the provider has not written.
  write_surfaces:
  - operation: 'createMachineOrder / createMppMachineOrder (paid retry) — and hosted-checkout drafts once paid'
    action: Print and mail a document (money spent, physical side effect)
    reversal: cancel + refund by emailing support@postalform.com before printing or carrier handoff; refund of the Stripe PaymentIntent for machine payments (USDC returned to the payer wallet)
    reversal_operation: null
    window: 'before printing or carrier handoff begins (stated as a condition; production "typically take[s] up to 2 business days after payment confirmation")'
    stated_terms:
    - {clause: 'Terms 5', verbatim: 'For non-Express orders, if you request cancellation before printing or carrier handoff begins, we may be able to cancel and refund, at our discretion.'}
    - {clause: 'Terms 5', verbatim: 'Express orders enter production immediately after payment confirmation. Express orders cannot be changed, canceled, or refunded after payment, even if you contact us moments later, except where required by law or where we determine the issue was caused by an error in our printing, processing, or fulfillment of the order.'}
    - {clause: 'Terms 5', verbatim: 'Once printing has started or the item has been handed to the mail carrier, the order is generally non-cancelable and non-refundable, except where required by law or where we determine the issue was caused by an error in our printing, processing, or fulfillment of the order.'}
    - {clause: 'Terms 5', verbatim: 'If there is a fulfillment error caused by us (for example, we printed the wrong file), our remedy is, at our option, reprint/resend or refund the affected order.'}
    - {clause: 'agents.md Refunds', verbatim: 'Stripe supports refunds for crypto pay-ins in live mode. If you need to reverse a machine payment, you can refund the Stripe PaymentIntent and have USDC sent back to the payer wallet.'}
    - {clause: 'help/refunds FAQ', verbatim: 'Can PostalForm recall a letter after carrier acceptance? No. After carrier acceptance, the original order cannot be canceled through PostalForm.'}
    grade: documented
  - operation: 'createLetter / createPostcard (Projects, live mode)'
    action: Create a live mail order funded from prepaid credits
    reversal: same support-email path; the contract exposes canceled as a MailOrderStatus value and postalform.letter.canceled / postalform.postcard.canceled as webhook events, but no cancel operation
    reversal_operation: null
    window: 'before printing or carrier handoff begins (same Terms)'
    grade: documented
    note: 'Live orders "reserve and capture the quoted amount" from the credit ledger; the ledger (listCreditLedger) is where a refund would appear. Test-mode orders have no money to reverse.'
  - operation: 'createMachineFlowerLetter / createMppMachineFlowerLetter'
    action: Order a Florist One arrangement with a card note
    reversal: none documented beyond the general Terms
    window: null
    grade: none
    note: Flower delivery dates and substitutions (allow_substitutions) are set at order time; no florist cancellation window is published.
  - operation: createMppShippingLabel
    action: Purchase a carrier shipping label (signed PDF)
    reversal: none documented
    window: null
    grade: none
  - operation: 'unpaid drafts (any surface)'
    action: Create an unpaid draft / 402-challenged order
    reversal: 'na — nothing has been printed or charged; abandoned unpaid uploads are swept after a TTL (security page)'
    grade: na
  - operation: 'Projects configuration writes (webhook endpoints, key rotation, auto-refill, credit top-ups)'
    action: Configuration and funding
    reversal: 'disableWebhookEndpoint reverses createWebhookEndpoint; rotateApiKey / rotateWebhookEndpointSecret are forward-only; credit top-ups are prepaid balances (refund policy not stated)'
    grade: documented
