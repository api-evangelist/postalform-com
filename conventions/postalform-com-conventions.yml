payment:
  protocols: [x402, mpp, hosted checkout (Stripe), Stripe shared payment token (ACP checkout_session), UCP checkout]
  x402: {asset: USDC, network: 'Base eip155:8453 (Base Sepolia eip155:84532 for tests)', facilitator: 'https://api.cdp.coinbase.com/platform/v2/x402', headers: 'PAYMENT-REQUIRED -> PAYMENT-SIGNATURE -> PAYMENT-RESPONSE', settlement: '202 settled_pending_webhook until Stripe verifies the Base transaction; poll, do not pay again'}
  mpp: {methods: [tempo, stripe_spt, card], headers: 'WWW-Authenticate: Payment (one per method) -> Authorization: Payment -> Payment-Receipt', settlement: '202 settled_pending_webhook until the Stripe webhook marks the PaymentIntent paid'}
  flow: 'validate (free) -> create (402 with preview_url) -> owner approval -> pay one challenge -> retry the byte-identical body with the same request_id -> poll status until payment_status paid'
  price_bounds: '$3.40 - $200.00 per document order (x-payment-info); flowers $1.00 - $250.00 (x402 manifest)'
  never: 'raw card details — "PostalForm does not accept raw card details over this API"'
address_model:
  strategies: 'exactly one per party: Address (Loqate *_address_id + *_address_text) or Manual (*_address_manual {line1, line2?, city, state?, zip, countryCode?})'
  countries: [US, CA, AT, BE, CH, DE, ES, FR, GB, IN, LU, NL]
  default_country: US
  projects_aliases: 'MailingAddress accepts line1|street1|address_line1|addressLine1, city|address_city, countryCode|country_code|country|address_country|addressCountry (additionalProperties true)'
document_model:
  sources: 'exactly one of pdf ({upload_token} preferred; {download_url, file_id}; data:application/pdf;base64 URL; allowlisted HTTPS URL), letter (string or {title, body, signature, format text|html|markdown|rtf, render}), form ({slug, fields, attachments} from the forms catalog), or bulk ({csv_content, content_mode text|html|pdf, template_text|template_html|campaign_name})'
  preview: 'unpaid single-recipient creates may return preview_url — a signed short-lived PDF for owner review before payment'
  postcards: 'mailpiece_type postcard + postcard_size 4x6|6x9|11x6; 2-page PDF on the published bleed templates; page 2 mailing side must not carry addresses'
