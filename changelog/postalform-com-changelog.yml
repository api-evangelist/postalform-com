- version: August 2026 product update
  date: '2026-08-31'
  url: https://blog.postalform.com/posts/postalform-product-update-august-2026/
  breaking: false
  additions:
  - 'Spain added to the supported mailing network — now 12 destination countries (US, CA, AT, BE, CH, DE, ES, FR, GB, IN, LU, NL) across postalform.com, PostalForm Projects, machine orders and the published API schemas.'
  - '132 origin-to-destination international mailing guides.'
  - 'Fuller Certified Mail receipt options: Electronic Return Receipt (signed USPS PDF), physical PS Form 3811, Restricted Delivery, manual or automatic e-receipt delivery — exposed on Projects quotes/orders (return_receipt_format, restricted_delivery, err_delivery, err_email) with receipt download and ZIP/CSV export; electronic receipts retained three years by default in Projects.'
  - 'Four consumer packets added to the forms catalog: Bank Fraud Claim and Unauthorized Transfer Dispute, PMI Cancellation Request, Security Deposit Recovery, and a fourth dispute workflow.'
  - 'Live Projects fulfillment (live keys, prepaid credits).'
- version: July 2026 product update
  date: '2026-07-31'
  url: https://blog.postalform.com/posts/postalform-product-update-july-2026/
  breaking: false
  additions:
  - 'Browser-based PDF editor (replace text, move/resize images, add images/stamps/signatures, merge and split).'
  - 'DS-82 passport renewal kit with eligibility check and prepaid tracked USPS label.'
  - 'Guided packet builders: bankruptcy, court, family-court and probate correspondence; tax-return print-and-sign kits; landlord repair, refund and cease-and-desist requests; solar-contract cancellation (required Certified Mail); mortgage payment and escrow error packet.'
  - 'Role-aware address fields in workflow schemas (sender, recipient, business, property, employer).'
  - 'Canada Registered Mail option across customer and developer order paths; clearer expedited/signature choices.'
  - 'Redesigned PostalForm Projects (free test workspace to live integration path).'
