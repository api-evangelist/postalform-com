summary: >-
  PostalForm documents that throttling EXISTS on two surfaces — address searches and unpaid order creation —
  with the exhaustion signal (HTTP 429, code rate_limited) and the instruction "slow down ... and retry
  later", but publishes no numeric ceiling, no window and no response headers. No X-RateLimit-*, RateLimit-*
  or Retry-After header was declared in either OpenAPI or observed on live responses; the only per-request
  header is x-request-id. The Projects API documents no rate limit at all. What IS published in numbers is a
  set of size limits, recorded separately below.
rate_limits:
- name: Address search throttle
  scope: per-client (unspecified)
  limit: null
  window: null
  metric: address searches
  applies_to: [postalform.search_addresses (MCP)]
  exhaustion_status: 429
  exhaustion_code: rate_limited
  headers: []
  source: 'https://postalform.com/agents — "429 (rate_limited): slow down address searches and retry later."'
  note: Number and window not published.
- name: Unpaid order creation throttle
  scope: per-client (unspecified)
  limit: null
  window: null
  metric: unpaid create calls
  applies_to: [createMachineOrder, createMppMachineOrder, createMachineFlowerLetter, createMppMachineFlowerLetter, createMppShippingLabel]
  exhaustion_status: 429
  exhaustion_code: rate_limited
  headers: []
  source: 'https://postalform.com/mpp.md — "429 rate_limited: slow down unpaid order creation and retry later."'
  note: >-
    Number and window not published. Related, not a rate limit: PostalForm "only collapses recent unpaid
    duplicate drafts" for the same request_id, so repeated unpaid creates with one request_id do not multiply
    orders.
