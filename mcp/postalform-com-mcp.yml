method: probed
status: published
source: https://postalform.com/mcp
docs: https://postalform.com/developers
summary: 'PostalForm operates ONE remote MCP server at https://postalform.com/mcp — the same host as its
  website, OpenAPI, A2A card and machine-payments REST API. It is Streamable HTTP (the developers page
  documents POST/GET/DELETE with an mcp-session-id header after initialize), speaks MCP protocol version
  2025-06-18 on the wire (the /.well-known/mcp.json manifest and server card declare 2025-11-25), identifies
  itself as serverInfo {name: postalform, version: 0.1.0}, and answers initialize, tools/list and resources/list
  anonymously. tools/list returns 12 tools, each with a real JSON Schema inputSchema, an outputSchema,
  MCP annotations (readOnlyHint/destructiveHint/idempotentHint/openWorldHint) and an execution.taskSupport
  flag — saved verbatim in mcp/postalform-com-mcp-tools.json. resources/list returns one resource, an
  OpenAI Apps SDK style widget (ui://widget/postalform-v5.html). The server is discoverable through five
  provider-published documents on the same host: /.well-known/mcp.json, /.well-known/mcp/server.json (MCP
  Registry schema 2025-12-11, name com.postalform/postalform), /.well-known/mcp/server-card.json, /.well-known/capability-card.json
  and the RFC 9727 /.well-known/api-catalog linkset. Authorship is not in doubt: tool names carry the
  postalform. prefix, the instructions name support@postalform.com, and the same tools are listed on https://postalform.com/developers.'
deployment:
  mode: remote
  endpoint: https://postalform.com/mcp
  auth: none
  verified: probed
  note: 'A hosted HTTPS Streamable HTTP endpoint an MCP client POSTs to directly; initialize and tools/list
    need no credential ("No API key is required for the hosted MCP endpoint today" — /.well-known/mcp.json;
    the developers page adds "contact support@postalform.com for allowlisting"). No OAuth metadata is
    served on this host (/.well-known/oauth-authorization-server and /.well-known/oauth-protected-resource
    both 404). Money-moving tools are gated by PAYMENT, not by a credential: draft tools return a hosted
    checkout_url or an ACP checkout_session; complete_checkout needs a buyer-approved Stripe shared payment
    token (spt_...); postalform.create_machine_order returns an MPP or x402 402 challenge and is retried
    with payment_authorization / payment_signature. A stdio server exists as source code (github.com/postalform/agent-mail-mcp,
    bin agent-mail-mcp, MIT) but its npm package @postalform/agent-mail-mcp is NOT published (registry
    404, 2026-09-19) and the README says "after publication", so `npx -y @postalform/agent-mail-mcp` cannot
    run today — mode is remote, not both.'
  local_stdio_candidate:
    repo: https://github.com/postalform/agent-mail-mcp
    package: '@postalform/agent-mail-mcp'
    version_in_repo: 0.1.0
    npm_status: unpublished (https://registry.npmjs.org/@postalform%2Fagent-mail-mcp -> 404)
    run_from_source: npm install && npm run server
    documented_install_after_publication: npx -y @postalform/agent-mail-mcp
    tools:
    - agent_mail_discovery
    - list_postalform_tools
    - validate_letter_mail
    - create_letter_checkout_draft
    note: A thin wrapper — it calls the remote server and the REST validate endpoint; it does not replace
      the hosted surface.
servers:
- id: postalform
  name: PostalForm MCP Server
  endpoint: https://postalform.com/mcp
  transport: streamable-http
  http_methods:
  - POST
  - GET
  - DELETE
  session_header: mcp-session-id
  auth: none
  payment: hosted checkout URL, Stripe shared payment token via complete_checkout, or MPP / x402 402 challenge
    via postalform.create_machine_order (USDC on Base eip155:8453 for x402; Tempo, Stripe SPT or card
    for MPP)
  status: live
  probe:
    fetched: '2026-09-19'
    initialize:
      http_status: 200
      content_type: text/event-stream
      protocol_version: '2025-06-18'
      server_info:
        name: postalform
        version: 0.1.0
      capabilities:
        resources:
          listChanged: true
        tools:
          listChanged: true
      instructions: 'PostalForm prints and mails physical letters, documents, and forms via USPS. Typical
        flow: validate addresses, prepare a draft and review its price, then obtain buyer approval before
        complete_checkout with a compatible Stripe payment token, hosted checkout, or a direct MPP/x402
        payment. Docs and guidance: https://postalform.com/agents (agent payment workflows), https://postalform.com/developers
        (API reference), https://postalform.com/openapi.json (OpenAPI spec). Developers and agents can
        provision PostalForm infrastructure and build on these APIs at https://projects.postalform.com
        (Stripe Projects CLI or regular login). Support: support@postalform.com.'
    tools_list:
      http_status: 200
      content_type: text/event-stream
      tool_count: 12
      file: mcp/postalform-com-mcp-tools.json
    resources_list:
      http_status: 200
      resources:
      - uri: ui://widget/postalform-v5.html
        name: postalform-widget
    discovery_documents:
    - url: https://postalform.com/.well-known/mcp.json
      status: 200
      file: well-known/postalform-com-mcp.json
      declares: protocol_version 2025-11-25, transport streamable-http, authentication.type none, 5 recommended
        tools, works_with 15 clients
    - url: https://postalform.com/.well-known/mcp/server.json
      status: 200
      file: well-known/postalform-com-mcp-server.json
      declares: MCP Registry server.schema.json 2025-12-11, name com.postalform/postalform, remotes[0]
        streamable-http https://postalform.com/mcp
    - url: https://postalform.com/.well-known/mcp/server-card.json
      status: 200
      file: well-known/postalform-com-mcp-server-card.json
      declares: mcp-server-card v1, protocolVersion 2025-11-25, transport endpoint /mcp
    - url: https://postalform.com/.well-known/capability-card.json
      status: 200
      file: well-known/postalform-com-capability-card.json
      declares: auth_methods [none], pricing_model pay_per_call, sandbox_available false, human_signup_required
        false
    - url: https://postalform.com/.well-known/oauth-protected-resource
      status: 404
    - url: https://postalform.com/.well-known/oauth-authorization-server
      status: 404
