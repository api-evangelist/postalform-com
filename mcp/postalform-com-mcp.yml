- name: postalform.create_machine_order
  description: Create a single PDF, letter, workflow-form order, or bulk letter campaign and pay through
    MPP or x402 after buyer approval. For bulk, provide exactly one of bulk.csv_content or bulk.recipients
    (JSON address objects with optional merge_fields), plus a shared PDF or text/HTML template. Omit top-level
    recipient fields and review campaign_url, recipient count and total. Bulk MPP orders can also use
    postalform.pay_order after fetching its challenge. The unpaid response also includes checkout_url
    and status_url for this same order. Without an available compatible wallet, give the buyer checkout_url
    and poll status_url; never recreate the order to change payment paths. Single-recipient clients with
    a Stripe shared payment token can instead use a draft tool followed by complete_checkout; other clients
    should present the hosted checkout URL.
  title: Create or pay a machine order
  annotations:
    readOnlyHint: false
    destructiveHint: false
  input:
  - payment_protocol
  - request_id
  - buyer_name
  - buyer_email
  - pdf
  - letter
  - form
  - file_name
  - sender_name
  - sender_address_id
  - sender_address_type
  - sender_address_text
  - sender_address_manual
  - recipient_name
  - recipient_address_id
  - recipient_address_type
  - recipient_address_text
  - recipient_address_manual
  - double_sided
  - color
  - mail_class
  - certified
  - certified_return_receipt
  - signature_required
  - mailpiece_type
  - postcard_size
  - payment_authorization
  - payment_signature
  required:
  - buyer_name
  - buyer_email
  - sender_name
  - recipient_name
- name: postalform.pay_order
  description: Get an MPP challenge or pay an existing MPP PDF, letter, workflow-form order, or bulk letter
    campaign after buyer approval. Use the order_id returned by any draft tool with payment_protocol=mpp
    or by create_machine_order. When switching from create_machine_order, omit the credential first to
    get this payment endpoint’s challenge. Review the preview or campaign_url, recipient count and total.
    No document or addresses are resubmitted. Without payment_authorization this only returns a challenge;
    with it, this can pay and send real mail. Reuse the same order_id on retries and follow the returned
    payment status.
- name: complete_checkout
  description: After the buyer approves the prepared order and total, pay its existing checkout session
    using a compatible Stripe payment token, including a shared payment token (spt_...). Pass the order
    ID as checkout_session_id; do not resend the document or addresses. On an interrupted request, retry
    the same checkout and token. Existing authorized, processing, or paid payments are reused; follow
    the returned status and messages.
  title: Pay a prepared checkout
  annotations:
    readOnlyHint: false
    destructiveHint: false
  input:
  - checkout_session_id
  - buyer
  - payment_data
  required:
  - checkout_session_id
  - buyer
  - payment_data
- name: postalform.get_order_status
  description: Read payment, processing, stored mailing/carrier status, the latest 50 public tracking
    events, and electronic return receipt availability. Bulk orders also return campaign_url, recipient
    count and per-status counts; use the campaign dashboard for individual recipients. Missing carrier
    evidence is null; processing or a tracking number alone does not prove mailing or delivery. This read
    does not pay, mail, or acquire receipts.
  title: Get order status
  annotations:
    readOnlyHint: true
    destructiveHint: false
    idempotentHint: true
    openWorldHint: false
  input:
  - order_id
  required:
  - order_id
- name: postalform.ping
  description: Use this when you want a quick health check that the PostalForm MCP server is reachable.
  title: Ping PostalForm
  annotations:
    readOnlyHint: true
    destructiveHint: false
    idempotentHint: true
    openWorldHint: false
  input: []
  required: []
