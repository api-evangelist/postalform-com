versioning:
  scheme: >-
    Two schemes. The Machine Payments API is unversioned in its paths (/api/machine/...) and carries
    info.version 1.0.0; the Projects API uses a path version (/api/v1/...) and a DATE as info.version
    (2026-05-06), with a pricing_version string returned on every quote so a price can be reproduced.
  current_version:
    machine_payments_api: 1.0.0 (openapi info.version)
    projects_api: 2026-05-06 (openapi info.version); path prefix /api/v1
    mcp_server: 0.1.0 (serverInfo.version; wire protocol 2025-06-18, manifests declare 2025-11-25)
    a2a_card: 0.1.0 (card version; protocolVersion 1.0)
    apis_json: modified 2026-05-31
  policy_published: false
  note: >-
    No versioning or backward-compatibility policy page exists. Version signals are the OpenAPI info.version
    values, the MCP/A2A manifest versions, the dated pricing_version on Projects quotes, and dated legal pages
    (Terms updated 2026-07-10, Privacy 2026-06-18, Acceptable Use and Content Policy). The Projects
    /llm-context.txt notes that "legacy /stripe-projects adapter routes are internal" and the /agentic base is
    the one Stripe Projects calls — an internal migration, not a public deprecation.
deprecation:
  policy_published: false
  sunset_header: false
  deprecation_header: false
  rfc8594: false
  deprecated_operations: []
  note: >-
    Zero operations carry deprecated: true in either contract. No Sunset or Deprecation header is declared.
    /changelog and /status return 404 on postalform.com and a JSON 404 on projects.postalform.com. No
    Deprecation pointer is emitted.
status_page:
  url: https://postalform.com/api/health
  kind: machine health endpoint (component checks), not a human incident page
  provider_declared_as: StatusPage (in the provider's own https://postalform.com/apis.json common[]) and as the RFC 9727 api-catalog "status" relation for every anchor
  probed:
  - url: https://postalform.com/api/health
    status: 503
    fetched: '2026-09-19'
    body_summary: '{"status":"degraded", checks: db ok, redis ok, queue NOT ok (458 delayed, 53 failed, "failed jobs present"), worker ok (5 queues), ghostscript ok 10.02.1}'
  - {url: 'https://postalform.com/status', status: 404}
  - {url: 'https://projects.postalform.com/status', status: 404}
  note: >-
    A real, provider-published, machine-readable health document with per-component checks, queue depth and
    worker freshness — more than most status pages disclose — but no incident history, uptime figure or
    subscription. It answered 503 "degraded" at probe time because the job queue held failed jobs, which is
    the endpoint doing its job; a liveness grader that reads only the status code will mark it dead. The
    StatusPage pointer is emitted because the provider itself publishes it as such.
sla:
  published: false
  uptime_target: null
  note: >-
    No uptime SLA. The Terms (section 4) commit to production timing instead: "Printing, mail preparation,
    and carrier handoff typically take up to 2 business days after payment confirmation", delivery times are
    estimates only, and no delivery date is guaranteed. Support response times are not stated.
