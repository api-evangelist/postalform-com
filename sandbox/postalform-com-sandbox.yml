summary: >-
  PostalForm has three rehearsal surfaces of different strength. (1) PostalForm Projects has a REAL separate
  test environment: every workspace gets a pf_test_ key and a pf_live_ key, and test keys "simulate uploads,
  quotes, orders, timelines, and webhooks for free" and "never send physical mail" — the OpenAPI models this
  as a Mode enum (test | live) on API keys, orders and credit balances, with a mock_test_credits billing rail.
  (2) The Machine Payments API has no separate environment but a free validate/quote twin for every paid
  create (validateMachineOrder, validateMppMachineOrder, validateMachineFlowerLetter, ...) and the docs name
  testnets for the payment leg (Base Sepolia eip155:84532 for x402; Tempo testnet for MPP; Stripe's
  granted-token test helper to mint an spt_ token; the Visa SDK mock flow for card-MPP). (3) The MCP server
  ships a read-only preview tool (postalform.preview_letter_order_draft) and hosted-checkout drafts that
  commit nothing until paid. A fourth surface, /v1/test/mail_drafts, is documented on the quickstart page
  with a watermarked "TEST MODE" preview and fake tracking events, but the route 404s live. No test card
  numbers or test addresses are published by PostalForm (card entry is Stripe-hosted).
test_vs_live:
  projects_api:
    separate_environment: true
    key_prefixes: {test: pf_test_, live: pf_live_}
    mode_field: 'Mode enum [test, live] on ApiKey, Letter, CreditBalance; rotateApiKey takes {mode}'
    billing_rail_test: mock_test_credits
    billing_rail_live: prepaid_credits
    guarantees:
    - 'Test keys simulate the complete workflow for free and never send physical mail.'
    - 'Each workspace has separate test and live keys, credits, orders, and webhook settings.'
    - 'Signed webhooks fire in test mode too (simulated timelines).'
    env_vars_from_stripe_projects_provisioning: [POSTALFORM_TEST_API_KEY, POSTALFORM_LIVE_API_KEY, POSTALFORM_WORKSPACE_ID, POSTALFORM_API_BASE, POSTALFORM_DASHBOARD_URL, POSTALFORM_WEBHOOK_ENDPOINT_ID, POSTALFORM_WEBHOOK_SECRET]
    signup: https://projects.postalform.com/signup (or provision postalform/mail through Stripe Projects)
    source: https://postalform.com/developer-mail-api.md
  machine_payments_api:
    separate_environment: false
    key_prefixes: none (no API key on this surface)
    note: One host, no credentials. The dry run is the validate endpoint; the payment leg can be exercised on testnets.
  mcp_server:
    separate_environment: false
    note: postalform.preview_letter_order_draft is readOnlyHint true; draft tools create unpaid drafts that mail nothing until checkout completes.
