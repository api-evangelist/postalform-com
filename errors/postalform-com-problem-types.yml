problem_types:
- status: 400
  code: invalid_request
  title: Payload validation failed (documented alias of 422)
  occurrences: 1
  source_operations: [listMachineForms]
  remediation: Fix the query parameters (limit is an integer 1-200; cursor is opaque).
- status: 402
  code: payment_required
  title: Payment required — the normal first answer to a create call
  occurrences: 6
  media_types: {x402: application/json (X402PaymentRequiredResponse), mpp: application/problem+json (MppPaymentRequiredResponse)}
  source_operations: [createMachineOrder, createMachineFlowerLetter, createMppMachineOrder, createMppMachineFlowerLetter, createMppShippingLabel]
  headers: {x402: PAYMENT-REQUIRED, mpp: 'WWW-Authenticate: Payment ... (one per configured method: tempo, stripe, card)'}
  body_fields: [order_id, request_id, 'status|code payment_required', message, 'preview_url?', 'campaign_url?', 'postcard_guidelines_url?', 'MPP only: next_step, supported_methods, documentation_url, price_breakdown']
  remediation: >-
    Show preview_url to the owner, obtain approval, pay exactly one challenge, then retry the byte-identical
    body with the same request_id plus PAYMENT-SIGNATURE (x402) or the Authorization Payment header (MPP).
    Never create a second order.
- status: 404
  title: Order, form or receipt not found
  occurrences: 7
  source_operations: [getMachineFormSchema, getMachineOrder, getMachineFlowerLetter, getMppMachineOrder, getMppMachineFlowerLetter, getMppShippingLabel]
  remediation: Status endpoints accept the canonical order_id or any aliased request_id; check which one you stored.
- status: 409
  code: request_id_mismatch
  title: request_id reused with a different payload
  occurrences: 11
  source_operations: [validateMachineOrder, createMachineOrder, validateMachineFlowerLetter, createMachineFlowerLetter, validateMppMachineOrder, createMppMachineOrder, validateMppMachineFlowerLetter, createMppMachineFlowerLetter, validateMppShippingLabel, createMppShippingLabel]
  remediation: PostalForm treats request_id as a strict idempotency key and rejects payload drift. Resend the original body, or generate a fresh UUID for a genuinely different mailing.
- status: 422
  code: invalid_request
  title: Payload validation failed
  occurrences: 11
  source_operations: [validateMachineOrder, createMachineOrder, validateMachineFlowerLetter, createMachineFlowerLetter, validateMppMachineOrder, createMppMachineOrder, validateMppMachineFlowerLetter, createMppMachineFlowerLetter, validateMppShippingLabel, createMppShippingLabel]
  documented_causes:
  - Manual addresses — US needs a two-letter state and ZIP/ZIP+4; Canada a province and postal code; other countries line1, city and postal code.
  - Country must be one of US, CA, AT, BE, CH, DE, ES, FR, GB, IN, LU, NL (manual countryCode or Loqate id prefix).
  - Loqate *_address_type must be "Address", not "Container".
  - Exactly one document source (pdf, letter or form); postcard needs a valid postcard_size.
  - bulk.csv_content must parse to at least one valid row with line1, city, state, zip; template_text / template_html / top-level pdf required per content_mode.
  remediation: Read errors[] (path, code, message, hint, fix_examples) and correct each field before paying. Observed live above.
- status: 422
  code: missing_buyer_email
  title: buyer_email missing on a machine payment
  source_operations: [createMachineOrder, createMppMachineOrder]
  remediation: buyer_email is required; it becomes the Stripe receipt_email.
- status: 429
  code: rate_limited
  title: Rate limited
  documented_on: [postalform.search_addresses (address searches), unpaid order creation]
  headers_documented: none
  remediation: 'The docs say "slow down ... and retry later." No Retry-After or RateLimit-* header is documented or declared. See rate-limits/postalform-com-rate-limits.yml.'
- status: 500
  code: payment_error
  title: Payment verification failed or the payment provider returned an error
  source_operations: [createMppMachineOrder, createMachineOrder]
  remediation: Poll the status endpoint before retrying; a 202 settled_pending_webhook is not an error.
- status: 502
  title: Carrier rating upstream failure
  occurrences: 2
