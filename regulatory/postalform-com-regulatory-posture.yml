summary: >-
  PostalForm publishes a short privacy policy, terms, an acceptable-use policy and a content policy, and a
  security overview. Of the fourteen horizontal signals only one meets the substance bar: a data-subject
  request statement (access, correction, deletion by email). The privacy policy names vendor CATEGORIES
  (payment provider "for example, Stripe", print providers, mail carriers, hosting/analytics/support tools)
  but no dated subprocessor table, so subprocessors is not recorded; the security page describes retention
  and access practices but no SBOM, certification or incident-notification commitment; the terms state an
  18+ eligibility rule but no age-assurance mechanism; no accessibility conformance report, data-residency
  statement, transparency report, GPC statement or exit/portability commitment was found. The developer docs
  do name the fulfillment partners the routing uses (Click2Mail, PinGen, Lob, PostGrid, Florist One, Loqate,
  Stripe) — useful for a buyer, but as product routing documentation rather than a GDPR Art. 28 list.
