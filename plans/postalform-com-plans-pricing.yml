model: >-
  Pay per mailpiece, no subscription, no tiers. One price model (base fee + per-page printing, postage
  included, add-ons at checkout) is charged through three settlement paths: hosted checkout (Stripe card /
  Apple Pay / Google Pay / Link), machine payments (x402 USDC on Base, or MPP via Tempo / Stripe shared
  payment token / card) at the same quoted total, and PostalForm Projects prepaid credits for API-key
  integrations. Projects test mode is free.
summary: >-
  Every order starts with a $3.00 base fee; black-and-white pages are $0.20 each and color pages $0.40; a
  First Class letter carries an inserted address page, so a one-page letter is billed as two pages and
  "starts at about $3.40" (the x402 manifest's minPrice). Certified Mail, Electronic Return Receipt, Express
  and signature-required add-ons are priced at checkout; the provider's own Python pricing model (published
  on the pricing-calculator page for agents) states the constants below. The checkout or validate quote is
  always the source of truth for a real order.
