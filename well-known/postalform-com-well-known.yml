    oauth-authorization-server, oauth-protected-resource (RFC 9728 — relevant because this apex IS the MCP
    resource host), aauth-resource.json and asyncapi.yaml. Unserved paths return a 404 text/html page (the
    site's real 404, ~7.7 KB), and a negative-control path that cannot exist also 404s, so the 200s are
    served documents and not a catch-all. robots.txt carries a Content-Signal line (ai-train=yes, search=yes,
    ai-input=yes) and per-crawler allow rules for twelve named AI agents; it is saved as the consent signal.
