components:
  schemas:
    MachineOrderValidationResponse:
      type: object
      additionalProperties: false
      properties:
        request_id:
          type: string
          format: uuid
        request_hash:
          type: string
        order_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          description: Canonical server order id for an existing reusable draft, if one was found. This may differ from request_id when PostalForm collapses duplicate unpaid attempts.
        status:
          type: string
          enum:
          - validated_existing_order
          - validated_new_order
        postcard_guidelines_url:
          anyOf:
          - type: string
            format: uri
          - type: 'null'
          description: Canonical postcard PDF formatting guide. Present for postcard validation responses and null for letter responses.
        bulk:
          anyOf:
          - type: object
            additionalProperties: false
            properties:
              recipient_count:
                type: integer
                minimum: 1
              content_mode:
                type: string
                enum:
                - text
                - html
                - pdf
            required:
            - recipient_count
            - content_mode
          - type: 'null'
          description: Bulk campaign metadata when validating a bulk machine request. Null for single-recipient orders.
        quote:
          type: object
          additionalProperties: false
          properties:
            price_usd:
              type: number
            full_price_usd:
              type: number
            currency:
              type: string
              enum:
              - usd
            page_count:
              type: integer
              minimum: 1
            billable_page_count:
              type: integer
              minimum: 1
            double_sided:
              type: boolean
            color:
              type: boolean
            mail_class:
              type: string
              enum:
              - standard
              - priority
              - express
            certified:
              type: boolean
            certified_return_receipt:
              type: boolean
            return_receipt_format:
              type: string
              enum:
              - electronic
              - physical
            restricted_delivery:
              type: boolean
            err_delivery:
              type: string
              enum:
              - manual
              - email
            err_email:
              anyOf:
              - type: string
                format: email
              - type: 'null'
            signature_required:
              type: boolean
            mailpiece_type:
              type: string
              enum:
              - letter
              - postcard
            postcard_size:
              anyOf:
              - type: string
                enum:
                - 4x6
                - 6x9
                - 11x6
              - type: 'null'
            provider:
              type: string
          required:
          - price_usd
          - full_price_usd
          - currency
          - page_count
          - billable_page_count
          - double_sided
          - color
          - mail_class
          - certified
          - certified_return_receipt
          - mailpiece_type
          - postcard_size
          - provider
      required:
      - request_id
      - request_hash
      - order_id
      - status
      - postcard_guidelines_url
      - quote
    MachineErrorResponse:
      type: object
      additionalProperties: false
      properties:
        message:
          type: string
        code:
          type: string
        order_id:
          type: string
          format: uuid
        errors:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              path:
                type: string
              code:
                type: string
              message:
                type: string
              hint:
                type: string
              fix_examples:
                type: array
                items:
                  anyOf:
                  - type: string
                  - type: object
                    additionalProperties: true
            required:
            - path
            - code
            - message
      required:
      - message
      - code
    MachineWorkflowFormSchema:
      type: object
      additionalProperties: true
      description: Machine-usable workflow schema returned by the same schema renderer used by PostalForm MCP. It includes fields, groups, attachments, dependencies, and machine_submission.create_paths.
    MachineWorkflowFormListResponse:
      type: object
      additionalProperties: false
      properties:
        forms:
          type: array
          items:
            type: object
            additionalProperties: true
            properties:
              slug:
                type: string
              name:
                type: string
              description:
                anyOf:
                - type: string
                - type: 'null'
              category:
                anyOf:
                - type: string
                - type: 'null'
              certified_mail:
                type: string
                enum:
                - required
                - optional
                - none
              recipient_mode:
                type: string
              attachments:
                type: array
                items:
                  type: object
                  additionalProperties: true
                  properties:
                    id:
                      type: string
                    label:
                      type: string
                    required:
                      type: boolean
                  required:
                  - id
                  - label
                  - required
              create_paths:
                type: object
                additionalProperties: false
                properties:
                  x402:
                    type: string
                  mpp:
                    type: string
                required:
                - x402
                - mpp
            required:
            - slug
            - name
            - certified_mail
            - recipient_mode
            - attachments
            - create_paths
        next_cursor:
          anyOf:
          - type: string
          - type: 'null'
      required:
      - forms
      - next_cursor
    MachineFlowerLetterValidationResponse:
      type: object
      additionalProperties: true
      properties:
        request_id:
          type: string
          format: uuid
        request_hash:
          type: string
        order_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
        status:
          type: string
          enum:
          - validated_existing_order
          - validated_new_order
        protocol:
          type: string
          enum:
          - mpp
        methods:
          type: array
          items:
            type: string
            enum:
            - tempo
            - stripe_spt
            - card
        product_type:
          type: string
          enum:
          - flower_letter
        quote:
          type: object
          additionalProperties: true
          properties:
            product:
              type: object
              additionalProperties: true
              properties:
                code:
                  type: string
                name:
                  type: string
                priceCents:
                  type: integer
                  description: Arrangement price before Florist One delivery charges and destination tax.
                small:
                  anyOf:
                  - type: string
                    format: uri
                  - type: 'null'
                large:
                  anyOf:
                  - type: string
                    format: uri
                  - type: 'null'
              required:
              - code
              - name
              - priceCents
            total:
              type: object
              additionalProperties: true
              properties:
                subtotalCents:
                  type: integer
                orderTotalCents:
                  type: integer
                taxTotalCents:
                  anyOf:
                  - type: integer
                  - type: 'null'
                deliveryChargeCents:
                  anyOf:
                  - type: integer
                  - type: 'null'
              required:
              - subtotalCents
