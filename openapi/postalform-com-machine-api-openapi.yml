        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Machine order status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MachineOrderStatus'
        '404':
          description: Order not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MachineErrorResponse'
      tags:
      - Machine
