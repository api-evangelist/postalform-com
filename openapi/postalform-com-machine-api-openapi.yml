    MachineOrderRequest:
      type: object
      additionalProperties: false
      description: 'Machine order payload shared by the x402 and MPP create/validate endpoints. Send either a single-recipient order or a bulk mailing campaign. For a single-recipient order provide exactly one of pdf, form, or letter. For each provided address party choose exactly one strategy: verified Loqate Address fields or Manual address fields.'
      properties:
        request_id:
          type: string
          format: uuid
          description: Client-generated idempotency key for one logical mailing. Reuse the same value on payment retries, and generate a fresh UUID for a legitimate second order even if the payload is identical.
        buyer_name:
          type: string
          minLength: 1
          maxLength: 256
          description: Buyer / wallet owner display name.
        buyer_email:
          type: string
          format: email
          maxLength: 256
          description: Required for Stripe receipt delivery.
        pdf:
          oneOf:
          - type: string
            minLength: 1
            description: A data:application/pdf;base64,... URL or an allowlisted HTTPS download URL. The canonical format is the upload_token object variant.
          - type: object
            additionalProperties: false
            properties:
              upload_token:
                type: string
                minLength: 1
                description: Preferred canonical PDF reference. Get this from PostalForm PDF upload tooling.
            required:
            - upload_token
          - type: object
            properties:
              download_url:
                type: string
                format: uri
                description: HTTPS URL to a PDF file.
              file_id:
                type: string
                minLength: 1
                description: Stable file identifier paired with download_url.
            required:
            - download_url
            - file_id
            additionalProperties: true
        form:
          type: object
          additionalProperties: false
          description: Nested single-mailpiece workflow form payload. Discover available forms with GET /api/machine/forms, fetch the selected schema with GET /api/machine/forms/{slug}/schema, then send this form object instead of pdf or letter. Statutory workflows requiring coordinated service on multiple recipients are intentionally excluded.
          properties:
            slug:
              type: string
              minLength: 1
              description: Workflow form slug, for example 1120, 5471, or 5472.
            fields:
              type: object
              additionalProperties: true
              description: Workflow field values keyed by field id from the machine form schema. Compound fields use nested objects keyed by subfield id.
            attachments:
              type: array
              items:
                type: object
                additionalProperties: false
                properties:
                  id:
                    type: string
                    minLength: 1
                    description: Attachment id from the selected workflow schema.
                  label:
                    type: string
                    minLength: 1
                  file_name:
                    type: string
                    minLength: 1
                    maxLength: 255
                  content_type:
                    type: string
                    minLength: 1
                    description: Optional MIME type. A data URL MIME type also works inside base64.
                  base64:
                    type: string
                    minLength: 1
                    description: Base64 file content or a data:<mime>;base64,... URL.
                required:
                - id
                - base64
              description: Optional supporting files required by the workflow schema.
          required:
          - slug
          - fields
        letter:
          oneOf:
          - type: string
            minLength: 1
            maxLength: 20000
            description: Letter body text for PostalForm to render server-side. Uses text format unless top-level format is set.
          - type: object
            additionalProperties: false
            properties:
              title:
                type: string
                maxLength: 200
              body:
                type: string
                minLength: 1
                maxLength: 20000
              signature:
                anyOf:
                - type: string
                  maxLength: 2000
                - type: object
                  additionalProperties: false
                  properties:
                    mode:
                      type: string
                      enum:
                      - typed
                      - drawn
                    text:
                      type: string
                      maxLength: 2000
                    dataUrl:
                      type: string
                    printDataUrl:
                      type: string
              format:
                type: string
                enum:
                - text
                - html
                - markdown
                - rtf
                description: How PostalForm renders body. Defaults to text.
              render:
                type: object
                additionalProperties: false
                properties:
                  paper:
                    type: string
                    enum:
                    - letter
                    description: Only letter paper is supported for machine-rendered letters.
                  font_size:
                    type: integer
                    minimum: 9
                    maximum: 14
                  margin_in:
                    type: number
                    minimum: 0.5
                    maximum: 1.5
                  font:
                    type: string
                    enum:
                    - times
                    - helvetica
            required:
            - body
          description: Letter content for PostalForm to render server-side into a PDF. Provide exactly one of pdf, form, or letter.
        format:
          type: string
          enum:
          - text
          - html
          - markdown
          - rtf
          description: Optional shorthand for letter.format when letter is provided. Defaults to text.
        file_name:
          type: string
          minLength: 1
          maxLength: 255
          description: Optional display file name.
        sender_name:
          type: string
          minLength: 1
          maxLength: 256
        sender_address_id:
          type: string
          minLength: 1
          pattern: ^[A-Za-z]{2,4}\|
          description: Loqate Address id. The leading segment carries the country, for example US|... or CA|.... The country must be one of US, CA, AT, BE, CH, DE, ES, FR, GB, IN, LU, NL. Required for sender Address mode.
        sender_address_type:
          type: string
