                    campaign_name: April Outreach
                    csv_content: 'recipient_name,line1,line2,city,state,zip,account_number

                      Jane Doe,123 Main St,,Springfield,IL,62701,ACCT-100

                      John Smith,456 Oak Ave,Apt 2,Chicago,IL,60601,ACCT-200'
                    content_mode: text
                    template_text: Hello {{recipient_name}}, your account reference is {{account_number}}.
      x-payment-info:
