        double_sided:
          type: boolean
          description: Defaults to true.
        color:
          type: boolean
          description: Defaults to false.
        mail_class:
          type: string
          enum:
          - standard
          - priority
          - express
          description: Mail service level. Defaults to standard.
        certified:
          type: boolean
          description: Proof-mail add-on. Uses USPS Certified Mail for US destinations, Canada Post Registered Mail through PostGrid for Canadian destinations, and PinGen registered mail for supported European destinations. Defaults to false.
        certified_return_receipt:
          type: boolean
          description: Return Receipt add-on for US Certified Mail. Defaults to the electronic format. Ignored for Canada Post Registered Mail and PinGen registered-mail destinations where receipt/confirmation is part of the registered service rather than a separate add-on.
        return_receipt_format:
          type: string
          enum:
          - electronic
          - physical
          description: Electronic selects the signed USPS PDF. Physical selects the mailed PS Form 3811 green card. Requires certified_return_receipt=true.
        restricted_delivery:
          type: boolean
          description: Requests USPS Restricted Delivery for addressee-only delivery. Requires certified_return_receipt=true.
        err_delivery:
          type: string
          enum:
          - manual
          - email
          description: Defaults to manual USPS retrieval. Email makes PostalForm acquire and email the electronic receipt when available.
        err_email:
          type: string
          format: email
          maxLength: 256
          description: Optional destination for err_delivery=email. Defaults to buyer_email when omitted. Not valid for physical PS Form 3811.
        signature_required:
          type: boolean
          description: Request USPS signature on delivery. Defaults to false. Forced false for postcards or when mail_class is standard.
        mailpiece_type:
          type: string
          enum:
          - letter
          - postcard
          description: Optional mailpiece type. Defaults to letter. Set to postcard only when pdf is a fully composed postcard PDF that follows the published postcard layout guide. Nested workflow form and letter payloads are letter-only.
        postcard_size:
          type: string
          enum:
          - 4x6
          - 6x9
          - 11x6
          description: Required when mailpiece_type is postcard. The uploaded PDF must match the exact 2-page bleed template for that size. See /postcard-pdf-guidelines.
