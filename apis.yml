aid: postalform-com
name: PostalForm
description: >-
  PostalForm is an online print-and-mail service operated by MindBike Technologies LLC that turns PDFs,
  letters, filled government and consumer forms, dispute packets, postcards and CSV bulk campaigns into real
  postal mail for twelve countries, with address validation, Certified Mail and electronic return
  receipts. It is built agent-first: a remote MCP server at
  https://postalform.com/mcp (12 tools, no credential to connect) creates reviewable hosted-checkout drafts;
  a 17-operation Machine Payments API lets autonomous runtimes validate, pay for and track orders through
  x402 (USDC on Base) or Stripe's Machine Payments Protocol under an HTTP 402 challenge; an A2A 1.0 agent
  card, UCP and ACP checkout endpoints, an RFC 9727 api-catalog, an APIs.json index and an x402 manifest are
  served from /.well-known/. PostalForm Projects (25 operations) adds API-key workspaces with a free test
  mode, final-price quotes, Idempotency-Key orders, prepaid credits and signed webhooks.
