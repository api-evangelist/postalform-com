apis:
- aid: postalform-com:postalform-machine-payments-api
  name: PostalForm Machine Payments API
  description: >-
    Machine-oriented print-and-mail REST API for autonomous agents: validate and quote, then create, pay for
    and poll document mail orders (PDF, server-rendered letter in text/html/markdown/rtf, workflow form, or
    CSV bulk campaign), flower letters and MPP-only shipping labels. No API key — every paid create answers
    HTTP 402 with an x402 PAYMENT-REQUIRED header (USDC on Base, Coinbase CDP facilitator) or MPP
    WWW-Authenticate: Payment challenges (Tempo, Stripe shared payment token, card), and the retry reuses the
    same request_id, which the contract treats as a strict idempotency key. 17 operations across 17 paths,
    OpenAPI 3.1.0 with x-payment-info and x-agent-guidance extensions, served at https://postalform.com/openapi.json.
  humanURL: https://postalform.com/developers
  baseURL: https://postalform.com/api/machine
