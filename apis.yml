- aid: postalform-com:postalform-mcp-server
  name: PostalForm MCP Server
  description: >-
    Remote Model Context Protocol server at https://postalform.com/mcp (Streamable HTTP, wire protocol
    2025-06-18, serverInfo postalform 0.1.0). initialize, tools/list and resources/list answer anonymously
    with 12 tools carrying real inputSchema, outputSchema and annotations: list_forms, get_form_schema,
    search_addresses, create_pdf_upload, create_order_draft, preview_letter_order_draft,
    create_letter_order_draft, create_form_order_draft, create_machine_order, complete_checkout,
    get_order_status and ping. Draft tools return a hosted checkout_url and an ACP checkout_session so a
    human approves before any mail is printed; create_machine_order answers MPP/x402 challenges for
    authorized autonomous runtimes. Discoverable via /.well-known/mcp.json, mcp/server.json (MCP Registry
    schema) and mcp/server-card.json; sibling UCP and ACP checkout MCP endpoints at /ucp/mcp and /acp/mcp.
  humanURL: https://postalform.com/developers
  baseURL: https://postalform.com/mcp
  tags:
  - MCP
  - agent-native
  - Agent Commerce
  - Physical Mail
  properties:
