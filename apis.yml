- aid: postalform-com:postalform-projects-public-api
  name: PostalForm Projects Public API
  description: >-
    Developer mail infrastructure for server-side applications: per-workspace bearer API keys with a free
    simulated test mode (pf_test_) and a live mode on prepaid credits (pf_live_), two-step PDF upload,
    final-price quotes with a pricing_version, Idempotency-Key letter and postcard orders, order timelines
    with carrier tracking and electronic return receipts, signed fulfillment webhooks (PostalForm-Signature)
    with retries and replay, credit balance, ledger, top-up and auto-refill, and key rotation. 25 operations
    under /api/v1, OpenAPI 3.1.0 (info.version 2026-05-06) served at https://projects.postalform.com/openapi.json.
    Also provisionable as postalform/mail through Stripe Projects.
