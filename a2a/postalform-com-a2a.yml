agent_card:
  name: PostalForm
  description: >-
    PostalForm helps AI agents create reviewable physical-mail drafts and, when explicitly authorized, pay for
    print-and-mail orders through MCP, hosted checkout, MPP, or x402.
  url: https://postalform.com/a2a
  version: 0.1.0
  protocol_version: '1.0'
  preferred_transport: JSONRPC
  supported_interfaces:
  - {url: 'https://postalform.com/a2a', protocolBinding: JSONRPC, protocolVersion: '1.0'}
  additional_interfaces:
  - {url: 'https://postalform.com/a2a', transport: JSONRPC, protocolVersion: '1.0'}
  provider:
    organization: PostalForm
    url: https://postalform.com
  documentation_url: https://postalform.com/agents
  icon_url: https://postalform.com/og/default.png
  supports_authenticated_extended_card: false
  capabilities:
    streaming: false
    push_notifications: false
    state_transition_history: false
    extended_agent_card: false
    extensions:
    - uri: https://postalform.com/.well-known/x402
      description: x402 machine-payment discovery for PostalForm machine orders.
      required: false
    - uri: https://postalform.com/.well-known/ucp
      description: UCP shopping profile for PostalForm checkout and commerce discovery.
      required: false
  default_input_modes: [text/plain, application/json]
  default_output_modes: [text/plain, application/json]
  security_schemes: {}
  security: []
  skill_count: 3
  skills:
  - {id: postalform_mcp_connector_guidance, name: Connect an agent to PostalForm MCP, tags: [mcp, agent setup, postal mail, print and mail, developer tools]}
  - {id: postalform_mail_draft_planning, name: Plan a reviewable physical-mail draft, tags: [pdf mailing, letters, workflow forms, hosted checkout, mail drafts]}
  - {id: postalform_machine_payment_planning, name: Plan an authorized machine-paid mail order, tags: [x402, mpp, machine payments, agentic commerce, mail fulfillment]}
  skill_invocation: >-
    Each skill carries examples[] phrased as questions ("How should my agent connect to PostalForm?", "Which
    endpoint validates a machine-paid mail order before payment?") with text/plain and application/json
    input/output modes. The skills are GUIDANCE skills — they return the MCP endpoint, the draft path, or the
    machine-payment plan — rather than the mail-creating actions themselves, which live on the MCP server
    (12 tools) and the REST machine-payments API (17 operations). See mcp/postalform-com-tool-crosswalk.yml.
