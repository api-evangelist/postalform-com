      x402: https://postalform.com/.well-known/x402
    securityRequirements: []
conformance:
  spec: A2A 1.0.0
  grade: conformant
  protocol_version: '1.0'
  preferred_transport: JSONRPC
  hard_checks:
    capabilities_is_object: true
    protocol_version_present: true
    skills_is_array: true
  optional_fields:
    default_input_modes: true
    default_output_modes: true
    preferred_transport: true
  grade_basis: >-
    Graded against the A2A 1.0.0 hard checks. capabilities is an OBJECT (pass) carrying streaming,
    pushNotifications, stateTransitionHistory, extendedAgentCard and an extensions[] array. protocolVersion
    is present at the top level (pass), declared as "1.0", and the server echoes it in an a2a-version: 1.0
    response header. skills is an ARRAY (pass) of three fully-populated skills, each with id, name,
    description, tags, examples, inputModes and outputModes. All three optional discriminators are present:
    preferredTransport (JSONRPC), defaultInputModes and defaultOutputModes. The card carries BOTH the 1.0.0
    supportedInterfaces[] block (with protocolBinding) AND the 0.3-era top-level url + preferredTransport +
    additionalInterfaces[] triple, so it reads correctly under either revision.
  deviations:
  - field: JSON-RPC endpoint behaviour (https://postalform.com/a2a)
    observed: GET returns the agent card; POST tasks/get returns -32601 Method not found
    note: >-
      The card declares a JSONRPC interface at /a2a, but the A2A task methods are not implemented there —
      the provider describes /a2a as a "discovery bridge". An A2A client that reads this card and calls
      tasks/get gets a JSON-RPC method-not-found error, not an A2A task error. message/send was not probed
      (side effects). Recorded as a deviation of the SERVED surface, not of the card's shape; the executable
      agent surface is the MCP server the card's resources.mcpEndpoint points at.
  - field: securitySchemes / security
    observed: '{} and [] (declared, but empty)'
    note: >-
      The card declares no authentication scheme. That matches the MCP server (no credential required) and
      the machine-payments REST API, where payment (HTTP 402 x402 or MPP challenge) rather than a credential
      gates the paid actions. An agent cannot learn from securitySchemes that payment is the gate; it has to
      read the extensions[] URIs and the documentation.
  - field: resources, securityRequirements
    observed: present
    note: >-
      Not A2A 1.0.0 fields. resources is a useful provider extension (MCP endpoint, skill file, OpenAPI, x402
      manifest); securityRequirements duplicates the empty security[] under a non-standard name.
  - field: skills[]
    observed: three guidance skills, no action skills
    note: >-
      The skills explain how to connect and plan; none of them creates, pays for or tracks a mailing. The
      actions are on MCP (postalform.create_*_order_draft, postalform.create_machine_order,
      complete_checkout, postalform.get_order_status) and REST (createMachineOrder, createMppMachineOrder,
      getMachineOrder ...). A directory that indexes A2A skills as capabilities will under-represent what
      PostalForm can do.
  - field: capabilities.extensions[]
    observed: x402 and UCP discovery URIs, both required false
    note: >-
      The extension URIs point at the provider's own discovery documents (/.well-known/x402 version 2, and
      /.well-known/ucp declaring dev.ucp.shopping.checkout 2026-01-11) rather than at a registered A2A
      extension specification such as the a2a-x402 extension URI. Both documents are live and saved under
      well-known/.
surface_relationship:
  note: >-
    PostalForm publishes five agent-facing surfaces on one host and they are projections of one order
    pipeline: (1) A2A — this card plus a discovery bridge at /a2a; (2) MCP — 12 tools at
    https://postalform.com/mcp answering initialize and tools/list anonymously (mcp/postalform-com-mcp.yml);
    (3) REST — the 17-operation PostalForm Machine Payments API at https://postalform.com/api/machine/*
    (x402 and MPP 402 flows); (4) UCP checkout over MCP at /ucp/mcp and ACP checkout at /acp/mcp, declared in
    /.well-known/ucp and /.well-known/acp.json; (5) an RFC 9727 api-catalog linkset tying them together.
    A separate API-key product, PostalForm Projects (https://projects.postalform.com/api/v1, 25 operations,
    bearer pf_test_/pf_live_ keys, Idempotency-Key, signed webhooks), serves server-side developers rather
    than agents. See mcp/postalform-com-tool-crosswalk.yml for the tool-to-operation binding.
