discovery:
  path: /.well-known/agent-card.json
  canonical: true
  host: postalform.com
  note: >-
    Served from the apex host, which is also the OpenAPI servers[] host, the MCP host (https://postalform.com/mcp)
    and the declared A2A JSON-RPC host (https://postalform.com/a2a). The legacy /.well-known/agent.json path
    serves a byte-identical copy (3,417 bytes, cmp identical). www.postalform.com answers 200 for
    /.well-known/agent-card.json directly rather than redirecting. A negative-control path
    (/.well-known/apievangelist-negative-control-7f3a9c.json) returns 404 text/html, and every unserved
    /.well-known/* path (security.txt, openid-configuration, oauth-authorization-server,
    oauth-protected-resource) also 404s, so the 200 on agent-card.json is a served document and not an SPA
    catch-all. Ownership is not in question: provider.organization is "PostalForm" with provider.url
    https://postalform.com, the OpenAPI at the same host titles itself "PostalForm Machine Payments API", the
    card's resources block points at https://postalform.com/openapi.json and https://postalform.com/mcp, and
    the Terms of Service name the operator (MindBike Technologies LLC).
